{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Blog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'posts/css/estilos.css' %}">
</head>
<body>
    <header class="encabezado">
        <h1 class="logo">Mi Blog</h1>
        <nav class="menu">
            <a href="{% url 'posts:inicio' %}">Inicio</a>
            <a href="{% url 'posts:acerca' %}">Acerca de</a>
        </nav>
    </header>

    <main class="contenedor">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="pie">
        <p>&copy; 2026 Mi Blog. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
