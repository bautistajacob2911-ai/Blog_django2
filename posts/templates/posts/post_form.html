{% extends 'posts/base.html' %}

{% block titulo %}{{ titulo_pagina }} | Mi Blog{% endblock %}

{% block contenido %}
<section class="seccion">
    <h1 class="seccion-titulo">{{ titulo_pagina }}</h1>

    <form method="post" enctype="multipart/form-data" class="formulario">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="boton">Guardar</button>
        <a href="{% url 'posts:lista_posts' %}">Cancelar</a>
    </form>
</section>
{% endblock %}
