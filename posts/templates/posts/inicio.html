{% extends 'posts/base.html' %}

{% block titulo %}Inicio | Mi Blog{% endblock %}

{% block contenido %}
<section class="portada">
    <h1>Bienvenido a Mi Blog</h1>
    <p class="portada-texto">
        Ideas, notas y avances de mis proyectos, escritos mientras aprendo
        desarrollo web con Django.
    </p>
    <div class="acciones">

        <a class="boton boton-claro" href="{% url 'posts:acerca' %}">Conocer al autor</a>

</section>
{% endblock %}
